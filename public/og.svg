<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="630" rx="0" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg-pattern)" opacity="0.03"/>

  <!-- 装饰 -->
  <circle cx="1050" cy="100" r="200" fill="#E85D4A" opacity="0.05"/>
  <circle cx="150" cy="530" r="150" fill="#4A90D9" opacity="0.05"/>

  <!-- Logo 区域 -->
  <rect x="80" y="80" width="80" height="80" rx="20" fill="#E85D4A"/>
  <circle cx="100" cy="108" r="10" fill="white" fill-opacity="0.9"/>
  <circle cx="120" cy="102" r="10" fill="white" fill-opacity="0.9"/>
  <circle cx="140" cy="108" r="10" fill="white" fill-opacity="0.9"/>
  <text x="100" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#E85D4A">8</text>
  <text x="120" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#E85D4A">6</text>
  <text x="140" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#E85D4A">8</text>
  <text x="120" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="white">吉祥</text>

  <!-- 标题 -->
  <text x="80" y="240" font-size="56" font-weight="bold" fill="#1A1A2E" font-family="PingFang SC, Noto Sans SC, sans-serif">吉祥选号</text>
  <text x="80" y="300" font-size="24" fill="#4A4A68" font-family="PingFang SC, Noto Sans SC, sans-serif">基于中国传统命理学的彩票选号工具</text>

  <!-- 功能标签 -->
  <rect x="80" y="350" width="200" height="48" rx="24" fill="#FFF0EE"/>
  <text x="180" y="380" text-anchor="middle" font-size="16" fill="#E85D4A" font-family="PingFang SC, Noto Sans SC, sans-serif">今日黄道选号</text>

  <rect x="300" y="350" width="200" height="48" rx="24" fill="#EBF5FF"/>
  <text x="400" y="380" text-anchor="middle" font-size="16" fill="#4A90D9" font-family="PingFang SC, Noto Sans SC, sans-serif">生辰本命选号</text>

  <!-- 号码球装饰 -->
  <circle cx="900" cy="250" r="40" fill="#E85D4A" opacity="0.15"/>
  <text x="900" y="258" text-anchor="middle" font-size="28" font-weight="bold" fill="#E85D4A">08</text>

  <circle cx="980" cy="250" r="40" fill="#E85D4A" opacity="0.15"/>
  <text x="980" y="258" text-anchor="middle" font-size="28" font-weight="bold" fill="#E85D4A">16</text>

  <circle cx="1060" cy="250" r="40" fill="#E85D4A" opacity="0.15"/>
  <text x="1060" y="258" text-anchor="middle" font-size="28" font-weight="bold" fill="#E85D4A">25</text>

  <circle cx="1140" cy="250" r="40" fill="#4A90D9" opacity="0.15"/>
  <text x="1140" y="258" text-anchor="middle" font-size="28" font-weight="bold" fill="#4A90D9">06</text>

  <!-- 底部 -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#E8E8EE" stroke-width="1"/>
  <text x="80" y="560" font-size="14" fill="#8E8EA0" font-family="PingFang SC, Noto Sans SC, sans-serif">仅供娱乐 · 理性购彩 · 量力而行</text>

  <defs>
    <pattern id="bg-pattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1" fill="#1A1A2E"/>
    </pattern>
  </defs>
</svg>
